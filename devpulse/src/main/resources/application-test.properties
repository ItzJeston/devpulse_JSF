# ===================================================================
# DevPulse Application Configuration (Test Profile - H2 In-Memory)
# ===================================================================
spring.application.name=devpulse-test

# H2 In-Memory Fallback & Test DataSource (MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:student;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# SQL Scripts Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Spring MVC View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
