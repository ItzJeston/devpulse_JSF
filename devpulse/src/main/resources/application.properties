# ===================================================================
# DevPulse Application Configuration (Default Profile - MySQL)
# ===================================================================
spring.application.name=devpulse

# Server Port
server.port=8080

# MySQL Primary DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/student?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=student
spring.datasource.password=student

# Spring Data JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# SQL Scripts Initialization (Runs schema.sql and data.sql)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Spring MVC View Resolver for Embedded Tomcat Jasper JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
